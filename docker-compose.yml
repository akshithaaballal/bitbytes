version: '3.8'

services:
  agent-wrapper:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=5001
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install -r agent/requirements.txt -r automation/requirements.txt &&
             python agent/wrapper/agent_server.py"
    ports:
      - "5001:5001"
    restart: unless-stopped

  middleware:
    image: node:22-alpine
    working_dir: /app/middleware
    volumes:
      - .:/app
    environment:
      - PORT=4000
      - NODE_ENV=production
      - AGENT_URL=http://agent-wrapper:5001
      - OPERATOR_PASSCODE=${OPERATOR_PASSCODE:-dev-operator-passcode}
      - OPERATOR_TOKEN_SECRET=${OPERATOR_TOKEN_SECRET:-dev-token-secret-at-least-32-chars-long}
      - USER_TOKEN_SECRET=${USER_TOKEN_SECRET:-dev-user-token-secret-at-least-32-chars}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5180,http://127.0.0.1:5180}
    command: >
      sh -c "npm install &&
             node src/server.js"
    ports:
      - "4000:4000"
    depends_on:
      - agent-wrapper
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
    environment:
      - VITE_API_BASE=http://localhost:4000
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"
    ports:
      - "5180:5180"
    depends_on:
      - middleware
    restart: unless-stopped
