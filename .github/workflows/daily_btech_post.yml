name: Twice-Daily B.Tech Engineering Post Automation

on:
  schedule:
    # Runs twice daily (03:00 and 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: bitbytes-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish_daily_post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'automation/requirements*.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          pip install -r automation/requirements-dev.txt

      - name: Run Test Suite
        run: |
          pytest automation/tests/

      - name: Sync Cosmitude Forum Details
        continue-on-error: true
        env:
          COSMITUDE_USERNAME: ${{ secrets.COSMITUDE_USERNAME }}
          COSMITUDE_PASSWORD: ${{ secrets.COSMITUDE_PASSWORD }}
          COSMITUDE_SERVER_ID: ${{ secrets.COSMITUDE_SERVER_ID }}
          COSMITUDE_FORUM_ID: ${{ secrets.COSMITUDE_FORUM_ID }}
        run: |
          python -c "import sys, os; sys.path.insert(0, 'agent'); import Bot; Bot.getForumDetails()" || true

      - name: Run Daily Post Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          USE_AI_RADAR: "true"
          GENERATE_IMAGE: "true"
          COSMITUDE_USERNAME: ${{ secrets.COSMITUDE_USERNAME }}
          COSMITUDE_PASSWORD: ${{ secrets.COSMITUDE_PASSWORD }}
          COSMITUDE_SERVER_ID: ${{ secrets.COSMITUDE_SERVER_ID }}
          COSMITUDE_FORUM_ID: ${{ secrets.COSMITUDE_FORUM_ID }}
        run: |
          python automation/main.py

      - name: Verify Social Card Rendered
        run: |
          python -c "
          import os, glob, json, sys
          history_path = 'automation/history.json'
          if os.path.exists(history_path):
              with open(history_path, 'r', encoding='utf-8') as f:
                  h = json.load(f)
              if h and not h[-1].get('skipped_reason'):
                  imgs = glob.glob('automation/generated_images/*.png')
                  if not imgs:
                      print('[ERROR] Post was published but no social card image was generated.')
                      sys.exit(1)
                  print(f'[OK] Card verified: {imgs[-1]}')
          "

      - name: Upload Generated Social Cards
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-cards
          path: automation/generated_images/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit & Push New Archive, Index & Feed
        run: |
          git config --global user.name "BitBytes Daily Bot"
          git config --global user.email "bot@bitbytes.dev"
          git add -A automation/archive/ automation/INDEX.md automation/history.json automation/candidate_tracker.json frontend/public/feed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(daily): automated post archive & feed update [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
