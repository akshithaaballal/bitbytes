name: Twice-Daily B.Tech Engineering Post Automation

on:
  schedule:
    # Runs twice daily (03:00 and 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: bitbytes-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish_daily_post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
          pip install -r automation/requirements-dev.txt

      - name: Run Test Suite
        run: |
          pytest automation/tests/

      - name: Run Daily Post Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          USE_AI_RADAR: "true"
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          python automation/main.py

      - name: Commit & Push New Archive, Index & Feed
        run: |
          git config --global user.name "BitBytes Daily Bot"
          git config --global user.email "bot@bitbytes.dev"
          git pull --rebase origin main
          git add automation/archive/ automation/INDEX.md automation/history.json automation/candidate_tracker.json frontend/public/feed.json
          git diff-index --quiet HEAD || (git commit -m "chore(daily): automated post archive & feed update [skip ci]" && git push)
