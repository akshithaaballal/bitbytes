name: Hourly B.Tech Engineering Post Automation

on:
  schedule:
    # Runs at the top of every hour (24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  publish_daily_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run Daily Post Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          PUBLIC_IMAGE_URL: ${{ secrets.PUBLIC_IMAGE_URL }}
        run: |
          python automation/main.py

      - name: Commit & Push New Archive & Index
        run: |
          git config --global user.name "BitBytes Daily Bot"
          git config --global user.email "bot@bitbytes.dev"
          git add automation/archive/ automation/INDEX.md automation/history.json
          git diff-index --quiet HEAD || (git commit -m "chore(daily): automated post archive update [skip ci]" && git push)
